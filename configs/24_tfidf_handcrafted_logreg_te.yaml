# то же, что 05, плюс target encoding реплик: линейная модель для разнообразия в стекинге
run_name: 24_tfidf_handcrafted_logreg_te
seed: 42
cv: {n_splits: 5}
features:
  handcrafted: true
  partner_features: true
  own_text_tfidf: {analyzer: char_wb, ngram_range: [2, 5], min_df: 2, max_features: 100000, sublinear_tf: true}
  partner_text_tfidf: {analyzer: char_wb, ngram_range: [2, 5], min_df: 2, max_features: 50000, sublinear_tf: true}
model:
  name: message_te
  # три варианта признака и слабое сглаживание: лучшие по перебору на модели 19
  variants: [exact, template, knn]
  smoothing: 1.0
  n_splits: 5
  inner: {name: logreg, params: {C: 1.0, solver: liblinear, max_iter: 3000}}
postprocess: {pair_constraint: true}
