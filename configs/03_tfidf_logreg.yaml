# символьные n-граммы по репликам участника
run_name: 03_tfidf_logreg
seed: 42
cv: {n_splits: 5}
features:
  handcrafted: false
  own_text_tfidf: {analyzer: char_wb, ngram_range: [2, 5], min_df: 2, max_features: 100000, sublinear_tf: true}
model: {name: logreg, params: {C: 4.0, solver: liblinear, max_iter: 3000}}
postprocess: {pair_constraint: false}
