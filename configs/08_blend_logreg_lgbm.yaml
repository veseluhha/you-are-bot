# бленд: логрег на TF-IDF + ручных признаках (как 05) и бустинг на ручных признаках (как 06)
run_name: 08_blend_logreg_lgbm
seed: 42
cv: {n_splits: 5}
model:
  name: blend
  weights: [0.4, 0.6]
  members:
    - features:
        handcrafted: true
        partner_features: true
        own_text_tfidf: {analyzer: char_wb, ngram_range: [2, 5], min_df: 2, max_features: 100000, sublinear_tf: true}
        partner_text_tfidf: {analyzer: char_wb, ngram_range: [2, 5], min_df: 2, max_features: 50000, sublinear_tf: true}
      model: {name: logreg, params: {C: 1.0, solver: liblinear, max_iter: 3000}}
    - features: {handcrafted: true, partner_features: true}
      model:
        name: lgbm
        params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 15, min_child_samples: 20, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, reg_lambda: 1.0}
postprocess: {pair_constraint: true}
