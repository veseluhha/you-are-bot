# то же, что 11, плюс target encoding реплик обоих участников;
# бустинг короче (lr 0.02 x 600) и усреднён по 5 сидам — длинный переобучается (перебор на CV)
run_name: 19_pair_lgbm_swap_te
seed: 42
cv: {n_splits: 5}
model:
  name: message_te
  # три варианта признака и слабое сглаживание — лучшие по перебору на модели 19
  variants: [exact, template, knn]
  smoothing: 1.0
  n_splits: 5
  inner:
    name: pair
    swap_augment: true
    features:
      handcrafted: true
      partner_features: false
      own_text_a_tfidf: {analyzer: char_wb, ngram_range: [2, 4], min_df: 5, max_features: 20000, sublinear_tf: true}
      own_text_b_tfidf: {analyzer: char_wb, ngram_range: [2, 4], min_df: 5, max_features: 20000, sublinear_tf: true}
    model:
      name: lgbm
      seeds: 5
      params: {n_estimators: 600, learning_rate: 0.02, num_leaves: 15, min_child_samples: 40, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.5, reg_lambda: 1.0}
postprocess: {pair_constraint: false}
