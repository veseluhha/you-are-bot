# бустинг на ручных признаках обоих участников
run_name: 06_lgbm_handcrafted
seed: 42
cv: {n_splits: 5}
features: {handcrafted: true, partner_features: true}
model:
  name: lgbm
  params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 15, min_child_samples: 20, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, reg_lambda: 1.0}
postprocess: {pair_constraint: true}
